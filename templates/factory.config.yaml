# Factory 2.0 — project configuration
# Commit this file. Override per-environment with env vars if needed.

# ── Git ───────────────────────────────────────────────────────────────────────
git:
  integration_branch: dev       # PRs merge to this branch (e.g. dev, development, main)
  worktrees_dir: .worktrees     # isolated worktrees for parallel Pi runs

# ── Execution engines ─────────────────────────────────────────────────────────
# Default engine for tasks without an explicit Engine: field.
# Override per-task with: **Engine:** cursor | pi
execution:
  default_engine: cursor        # cursor | pi
  parallel_strategy: independent  # independent = no force-serialization across engines

# ── Pi (optional) ─────────────────────────────────────────────────────────────
pi:
  enabled: false                # set true after running scripts/bootstrap-pi.sh
  harness: ultimate-pi          # harness package name
  handoff_dir: .factory/handoff # TaskBrief YAML files written here
  review_in_cursor: true        # load executor-summary.yaml back into Cursor after Pi run

# ── Graphify (optional) ───────────────────────────────────────────────────────
graphify:
  enabled: false                # set true after: pip install graphifyy && graphify init .
  graph_dir: graphify-out       # where GRAPH_REPORT.md lives

# ── Sentrux (optional, self-hosted) ───────────────────────────────────────────
sentrux:
  enabled: false                # set true after: sentrux init (see scripts/bootstrap-pi.sh)
  rules_file: .sentrux/rules.toml
  block_on_violation: true      # block /ship if sentrux check_rules fails

# ── Quality gates ─────────────────────────────────────────────────────────────
quality:
  profile: standard             # standard | strict | minimal
  # standard:  verify + deslop + thermo + react-doctor + check-compiler
  # strict:    + sentrux session_end + make-pr-easy-to-review
  # minimal:   verify only

# ── Linear (human task management) ───────────────────────────────────────────
linear:
  enabled: false                # enable Linear sync (tasks.md is SSOT, Linear is human view)
  team_id: ""                   # Linear team ID
  project_id: ""                # Linear project ID (optional)
  sync_close: true              # mark Linear issue done when task closes

# ── Review policies ───────────────────────────────────────────────────────────
policies:
  security_reviewer: .factory/policies/security-reviewer.md   # focus areas for Cursor Security Agent
  quality_gates:     .factory/policies/quality.gates.yaml     # CI + PR gate thresholds
  approval_policy:   .factory/policies/approval.policy.yaml   # Cursor Approval Agent rules
